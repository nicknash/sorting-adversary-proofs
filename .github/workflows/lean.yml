name: Lean audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  trusted-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject placeholders and project-specific axioms in trusted sources
        run: ./scripts/check-trusted-no-sorry.sh
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "SortingAdversary"
          use-mathlib-cache: true
          # The full Mathlib/build tree exhausts the hosted runner while the
          # post-job GitHub cache is being archived.  Mathlib's own cache is
          # retained above; only the redundant `.lake` actions/cache is off.
          use-github-cache: false
          leanchecker: true
          leanchecker-args: "SortingAdversary"
          # lean-action v1's nanoda wrapper currently detects TOML packages only
          # through an obsolete `[package]` section.  Lake 4.33 uses the valid
          # top-level `name`, so the wrapper aborts before exporting any module.
          # Keep the full build, leanchecker, source audit, and axiom audit below.
          nanoda: false
          axiom-audit: true
          axiom-audit-root: "SortingAdversary"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound,SortingAdversary.StrengthenedCurvature.legacy_certificate_check._native.native_decide.ax_1_1"
